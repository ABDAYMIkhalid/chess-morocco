services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: chess_morocco
      MYSQL_USER: chess
      MYSQL_PASSWORD: chess_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  backend:
    image: php:8.3-cli
    working_dir: /var/www/html
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: chess_morocco
      DB_USERNAME: chess
      DB_PASSWORD: chess_password
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  mysql_data:
